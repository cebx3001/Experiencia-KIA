<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>body{background:#08090a;color:#eef0ed;font:16px system-ui;max-width:1200px;margin:30px auto;padding:0 20px}h1{font-weight:400}p{line-height:1.6;color:#bfc7c8}video,img{width:100%;height:auto;display:block;background:#08090a}a{color:#b9dedf}button,select{background:#202527;color:white;border:1px solid #556064;padding:12px;cursor:pointer}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:16px 0}details{margin-top:25px}summary{cursor:pointer}</style>
<h1>Storm · Revisión 02</h1><p>20 segundos · Sonido integrado · Para revisión</p>
<video id="video" src="storm.mp4" poster="master.png" playsinline controls preload="metadata"></video>
<div class="controls"><button id="play">Reproducir con sonido</button><button id="mute" aria-pressed="false">Silenciar</button><label>Velocidad <select id="speed"><option value="1">Normal</option><option value="0.5">Lenta ×0,5</option></select></label><a href="storm.mp4" download>Descargar Storm</a></div>
<p>Recta y después curva, sin frenada. La simulación se desarma al regresar al maestro. La toma queda en validación hasta tu revisión.</p>
<details><summary>Comparar con el maestro aprobado</summary><img src="master.png" alt="Fotograma maestro aprobado de la Kia Tasman"><a href="master.png" download>Descargar maestro</a></details>
<script>const video=document.querySelector('video'),mute=document.querySelector('#mute');function sync(){mute.textContent=video.muted?'Activar sonido':'Silenciar';mute.setAttribute('aria-pressed',String(video.muted))}document.querySelector('#play').onclick=()=>{video.currentTime=0;video.muted=false;video.volume=1;sync();video.play().catch(()=>{})};mute.onclick=()=>{video.muted=!video.muted;sync()};video.onvolumechange=sync;document.querySelector('#speed').onchange=e=>video.playbackRate=+e.target.value;</script></html>
