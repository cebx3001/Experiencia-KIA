<script>const video=document.querySelector('video'),mute=document.querySelector('#mute');function sync(){mute.textContent=video.muted?'Activar sonido':'Silenciar';mute.setAttribute('aria-pressed',String(video.muted))}document.querySelector('#play').onclick=()=>{video.currentTime=0;video.muted=false;video.volume=1;sync();document.querySelector('#status').textContent='';video.play().catch(()=>document.querySelector('#status').textContent='Usa los controles del video o descarga el archivo para reproducirlo.')};mute.onclick=()=>{video.muted=!video.muted;sync()};video.onvolumechange=sync;document.querySelector('#speed').onchange=e=>video.playbackRate=+e.target.value;</script></html>
