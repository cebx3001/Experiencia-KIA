<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tasman — Material Studio</title><link rel="icon" href="../assets/kia-logo.svg" type="image/svg+xml"><link rel="stylesheet" href="studio.css"></head>
<body>
<main><canvas id="canvas" aria-label="Estudio interactivo Kia Tasman 2026"></canvas>
<header><img src="../assets/kia-logo.svg" alt="Kia"><span>MATERIAL STUDIO / 2026</span></header>
<section class="title"><p>EXPLORA CADA DETALLE</p><h1>Tasman.</h1><div id="paint-label">Tan Beige <span>TAM</span></div></section>
<aside aria-label="Vistas del vehículo"><button data-view="hero" aria-pressed="true">01 <span>3/4 frontal</span></button><button data-view="side">02 <span>Perfil</span></button><button data-view="rear">03 <span>Trasera</span></button><button data-view="paint">04 <span>Pintura</span></button><button data-view="wheel">05 <span>Rueda</span></button><button data-view="glass">06 <span>Cristales</span></button><button data-view="interior">07 <span>Interior</span></button></aside>
<footer><div><p>ACABADO EXTERIOR</p><div class="swatches" role="group" aria-label="Pinturas oficiales"><button data-paint="arena" style="--color:#8b806e" aria-label="Tan Beige TAM" aria-pressed="true"></button><button data-paint="gris" style="--color:#262931" aria-label="Interstellar Grey AGT"></button><button data-paint="negro" style="--color:#091113" aria-label="Aurora Black Pearl ABP"></button><button data-paint="verde" style="--color:#404c47" aria-label="Cityscape Green CGE"></button></div></div><div class="doors"><p>PUERTAS</p><div><button data-door="front_left" aria-pressed="false">Del. izq.</button><button data-door="front_right" aria-pressed="false">Del. der.</button><button data-door="rear_left" aria-pressed="false">Tras. izq.</button><button data-door="rear_right" aria-pressed="false">Tras. der.</button><button id="all-doors">Abrir todas</button></div></div><div class="settings"><label>Luz <input id="exposure" type="range" min="0.3" max="2" step="0.05" value="0.75"></label><button id="rotate" aria-pressed="false">Rotación 360°</button><button id="reset">Restablecer</button></div></footer>
<div class="hint">ARRASTRA PARA GIRAR · RUEDA PARA ACERCAR · MAYÚS + ARRASTRAR PARA DESPLAZAR</div>
<div id="loading" role="status"><div class="spinner"></div><p>Preparando los materiales…</p></div><div id="error" role="alert" hidden></div>
