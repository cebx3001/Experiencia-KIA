name: Collect official Tasman cabin reference candidates without paid generation
on:
  workflow_dispatch:
  push:
    branches: [feat/tasman-experiencia-cines]
    paths: ['.github/workflows/collect-tasman-interior-references.yml']
permissions:
  contents: write
jobs:
  references:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tasman-experiencia-cines
      - name: Read original Kia pages and list public image candidates
        run: |
          python3 - <<'PY'
          import json,re,urllib.request,urllib.parse
          from pathlib import Path
          out=Path('docs/tasman/video/interior/references');out.mkdir(parents=True,exist_ok=True)
          reports=[]
          links=[]
          for page in ['https://www.kia.com/ec/showroom/Tasman0/gallery.html','https://www.kia.com/ec/showroom/Tasman0/features.html']:
              req=urllib.request.Request(page,headers={'User-Agent':'Mozilla/5.0'})
              html=urllib.request.urlopen(req,timeout=45).read().decode()
              for href in re.findall(r'href=[\"\']([^\"\']+)',html):
                  if re.search(r'wa\.me|whatsapp|test.?drive',href,re.I):links.append(urllib.parse.urljoin(page,href.replace('&amp;','&')))
              candidates=[];seen=set()
              for match in re.finditer(r'[^\s\"\'<>]+\.(?:jpg|jpeg|png|webp)',html,re.I):
                  value=match.group().replace('&amp;','&')
                  if 'content/dam' not in value:continue
                  url=urllib.parse.urljoin(page,value)
                  if url in seen:continue
                  seen.add(url)
                  candidates.append({'url':url,'context':re.sub('<[^>]+>',' ',html[max(0,match.start()-400):match.end()+700])})
              reports.append({'page':page,'images':candidates})
          (out/'official-candidates.json').write_text(json.dumps(reports,indent=2,ensure_ascii=False)+'\n')
          (out/'official-contact-links.json').write_text(json.dumps(sorted(set(links)),indent=2)+'\n')
          import hashlib
          manifest=[]
          urls=[]
          for report in reports:
              for candidate in report['images']:
                  url=candidate['url']
                  match=re.search(r'wide-interior-(\d+)\.jpg$',url)
                  if (match and int(match.group(1)) in (1,2,3,4,5,6,7,8,13,14)) or url.endswith('/kia-tasman-360vr-int.jpg'):
                      if url not in urls:urls.append(url)
          for url in urls:
              assert urllib.parse.urlsplit(url).netloc=='www.kia.com'
              data=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=60).read(20000001)
              assert len(data)<20000000
              name=url.rsplit('/',1)[1];(out/name).write_bytes(data)
              manifest.append({'file':name,'url':url,'sha256':hashlib.sha256(data).hexdigest()})
          (out/'official-images.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print('Original Kia cabin photos downloaded; no media generation submitted.')
          PY
      - name: Save only public reference metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/tasman/video/interior/references
          if ! git diff --cached --quiet; then
            git commit -m 'Collect official Kia cabin image candidates without paid generation [skip ci]'
            git pull --rebase origin feat/tasman-experiencia-cines
            git push origin HEAD:refs/heads/feat/tasman-experiencia-cines
          fi
