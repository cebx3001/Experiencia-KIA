name: Generate Tasman Storm
on:
  workflow_dispatch:
  push:
    branches: [feat/tasman-experiencia-cines]
    paths: ['.github/workflows/generate-tasman-storm.yml']
permissions:
  contents: write
concurrency:
  group: tasman-seedance-storm
  cancel-in-progress: false
jobs:
  storm:
    if: github.ref == 'refs/heads/feat/tasman-experiencia-cines'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tasman-experiencia-cines
      - name: Ensure FFmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Verify Storm reference dimensions
        run: |
          for reference in docs/tasman/video/storm/references/*.jpg; do
            height=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$reference")
            test "$height" -ge 300
          done
      - name: Check budget and generate or resume Storm
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_ACCESS }}
        run: python3 tools/tasman-vadeo/produce.py storm
      - name: Persist the receipt and delivery
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/tasman/video/storm
          if ! git diff --cached --quiet; then
            git commit -m 'Save Storm generation and review status [skip ci]'
            git pull --rebase origin feat/tasman-experiencia-cines
            git push origin HEAD:refs/heads/feat/tasman-experiencia-cines
          fi
      - name: Preserve the playable proposal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tasman-storm
          path: docs/tasman/video/storm/
          retention-days: 30
