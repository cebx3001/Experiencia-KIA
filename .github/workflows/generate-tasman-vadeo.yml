name: Generate Tasman Vadeo
on:
  workflow_dispatch:
  push:
    branches: [feat/tasman-experiencia-cines]
    paths: ['.github/workflows/generate-tasman-vadeo.yml']
permissions:
  contents: write
concurrency:
  group: tasman-seedance-vadeo
  cancel-in-progress: false
jobs:
  vadeo:
    if: github.ref == 'refs/heads/feat/tasman-experiencia-cines'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tasman-experiencia-cines
      - name: Ensure FFmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Check budget and generate or resume Vadeo
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_ACCESS }}
        run: python3 tools/tasman-vadeo/produce.py
      - name: Persist the receipt and delivery
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/tasman/video/vadeo
          if ! git diff --cached --quiet; then
            git commit -m 'Save Vadeo generation and review status [skip ci]'
            git pull --rebase origin feat/tasman-experiencia-cines
            git push origin HEAD:refs/heads/feat/tasman-experiencia-cines
          fi
      - name: Preserve the playable proposal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tasman-vadeo
          path: docs/tasman/video/vadeo/
          retention-days: 30
