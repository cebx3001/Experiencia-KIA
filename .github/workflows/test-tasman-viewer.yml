name: Verify Kia Tasman Three.js on mobile-sized Chromium
on:
  workflow_dispatch:
  push:
    paths:
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'kia-three-renderer.js'
      - 'kia-annotations.js'
      - 'kia-carousel.js'
      - '.github/workflows/test-tasman-viewer.yml'
permissions:
  contents: read
jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium automation
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify editorial Kia Tasman carousel and vehicle actions
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/tasman-server.log 2>&1 &
          node --input-type=commonjs <<'NODE'
          const {chromium}=require("playwright");
          (async()=>{
            const browser=await chromium.launch({headless:true,args:[
              "--use-gl=angle","--use-angle=swiftshader",
              "--enable-webgl","--enable-unsafe-swiftshader",
              "--no-sandbox","--disable-dev-shm-usage"
            ]});
            const page=await browser.newPage({
              viewport:{width:915,height:412},
              deviceScaleFactor:1,isMobile:true,hasTouch:true
            });
            const pageErrors=[];
            page.on("pageerror",error=>pageErrors.push(error.message));
            page.on("console",m=>{if(m.type()==="error")console.log("CONSOLE:",m.text())});
            await page.goto("http://127.0.0.1:8765/?integration-test=carousel",{waitUntil:"domcontentloaded",timeout:45000});
            await page.waitForFunction(()=>window.__kiaViewerStatus?.loaded===true||!!window.__kiaViewerStatus?.error,
              null,{timeout:150000,polling:350});
            await page.waitForFunction(()=>!!window.__kiaCarousel && !!window.__kiaAnnotations,null,{timeout:20000});
            const initial=await page.evaluate(()=>({
              loaded:window.__kiaViewerStatus?.loaded,
              meshCount:window.__kiaViewerStatus?.meshCount,
              engine:window.__kiaViewerStatus?.engine,
              corrected:window.__kiaThreeViewer?.opaqueCorrected,
              categories:[...document.querySelectorAll(".kia-category")].map(b=>b.dataset.category),
              selected:window.__kiaCarousel?.selected,
              carouselVisible:!document.getElementById("kiaFeatureCarousel").hidden,
              hasOldAccordion:!!document.querySelector(".kia-rail-accordion"),
              testDriveBottom:!!document.querySelector(".bottom-right .footer-testdrive"),
              leftPromo:!!document.querySelector(".side-content #primaryButton"),
              textOnlyPromo:getComputedStyle(document.querySelector(".side-content #primaryButton")).backgroundColor,
              rightRailBorder:getComputedStyle(document.querySelector(".kia-category-rail")).borderLeftWidth,
              descriptionBelow:!!document.querySelector("#featureDetail.kia-bottom-description")
            }));
            console.log("EDITORIAL INIT:",JSON.stringify(initial));
            if(!initial.loaded||initial.engine!=="three"||initial.meshCount<23||
              !initial.corrected?.includes("Car")||!initial.corrected?.includes("Interior")||
              JSON.stringify(initial.categories)!==JSON.stringify(["cameras","colors","exterior","interior"])||
              initial.hasOldAccordion||!initial.testDriveBottom||!initial.leftPromo||
              initial.textOnlyPromo!=="rgba(0, 0, 0, 0)"||initial.rightRailBorder!=="0px"||
              !initial.descriptionBelow||!initial.carouselVisible)
              throw Error("Editorial vehicle layout or viewer failed: "+JSON.stringify(initial));
            await page.evaluate(()=>document.fonts.ready);
            const typography=await page.evaluate(()=>{
              const css=el=>getComputedStyle(document.querySelector(el));
              const h=document.querySelector("#vehicleCopy h1");
              const range=document.createRange();
              range.selectNodeContents(h.firstChild);
              const box=range.getBoundingClientRect();
              const area=document.querySelector(".side-content").getBoundingClientRect();
              return {
                display:css("#vehicleCopy h1").fontFamily,
                displayWeight:css("#vehicleCopy h1").fontWeight,
                year:css(".year").fontFamily,
                yearOutline:css(".year").webkitTextStrokeWidth,
                menu:css(".kia-category").fontFamily,
                copy:css(".vehicle-copy p").fontFamily,
                footer:css(".footer-testdrive").fontFamily,
                titleWidth:Math.round(box.width),
                titleAvailable:Math.round(area.width),
                titleOverflow:Math.round(box.right-area.right),
                loadedFonts:[...document.fonts].filter(f=>f.status==="loaded").map(f=>f.family)
              };
            });
            console.log("TYPOGRAPHY LANDSCAPE:",JSON.stringify(typography));
            if(!typography.display.includes("Monument Extended")||
               !typography.display.includes("Unbounded")||
               typography.displayWeight!=="900"||
               !typography.year.includes("Space Grotesk")||
               !typography.menu.includes("JetBrains Mono")||
               !typography.copy.includes("Space Grotesk")||
               !typography.footer.includes("JetBrains Mono")||
               typography.titleOverflow>12)
              throw Error("Editorial font system or layout failed: "+JSON.stringify(typography));
            const peek=await page.evaluate(()=>({
              previous:document.getElementById("carouselPeekPrev").textContent,
              next:document.getElementById("carouselPeekNext").textContent,
              current:document.getElementById("carouselSelected").textContent,
              counter:document.getElementById("carouselCounter").textContent
            }));
            if(!peek.previous||!peek.next||!peek.current)throw Error("Carousel must show adjacent items");
            await page.locator(".kia-category[data-category='cameras']").click();
            await page.locator(".kia-category[data-category='cameras']").click();
            await page.locator("#carouselNext").click();
            if(await page.evaluate(()=>window.__kiaCarousel.selected)!=="side")throw Error("Camera carousel did not advance");
            await page.locator(".kia-category[data-category='colors']").click();
            await page.locator("#carouselNext").click();
            await page.waitForFunction(()=>window.__kiaThreeViewer?.paintApplied==="gris",null,{timeout:15000});
            console.log("CAR BODY PAINT:",await page.evaluate(()=>window.__kiaThreeViewer?.paintApplied));
            await page.locator(".kia-category[data-category='exterior']").click();
            await page.waitForFunction(()=>window.__kiaAnnotations?.selected==="front_fascia",null,{timeout:15000});
            const exterior=await page.evaluate(()=>({
              selected:window.__kiaCarousel?.selected,
              desc:document.getElementById("featureDetail").textContent,
              detailBg:getComputedStyle(document.getElementById("featureDetail")).backgroundColor,
              carouselLabel:document.getElementById("carouselCategory").textContent,
              onRight:document.getElementById("featureDetail").getBoundingClientRect().left>window.innerWidth*.70
            }));
            console.log("EXTERIOR:",JSON.stringify(exterior));
            if(exterior.selected!=="front_fascia"||exterior.carouselLabel!=="EXTERIOR"||
              !exterior.desc.includes("DRL")||exterior.detailBg!=="rgba(0, 0, 0, 0)"||
              !exterior.onRight)throw Error("Lower-right fact presentation failed");
            await page.locator('#featureDetail button[aria-label="Cerrar anotación"]').click();
            if(!(await page.locator("#featureDetail").isHidden())||
               await page.evaluate(()=>window.__kiaCarousel.selected)!=="front_fascia")
              throw Error("X must hide only descriptive text");
            const macroPos=await page.evaluate(()=>window.__kiaViewerStatus?.getCamera?.());
            await page.locator(".kia-category[data-category='interior']").click();
            // Category itself returns to a full-car camera AND opens 4 doors.
            // It must NOT enter the cabin until the explicit CABINA choice.
            await page.waitForFunction(()=>
              Object.keys(window.__kiaThreeViewer?.getAllDoorDegrees?.()||{}).length===4&&
              Object.values(window.__kiaThreeViewer.getAllDoorDegrees()).every(a=>Math.abs(a)>55),
              null,{timeout:25000,polling:200});
            await page.waitForTimeout(1200);
            const overview=await page.evaluate(()=>({
              option:window.__kiaCarousel?.selected,
              selectedAnnotation:window.__kiaAnnotations?.selected,
              inCabin:window.__kiaThreeViewer?.isInCabin?.(),
              camera:window.__kiaViewerStatus?.getCamera?.(),
              doors:window.__kiaThreeViewer?.getAllDoorDegrees?.(),
              optionLabel:document.getElementById("carouselSelected").textContent
            }));
            console.log("INTERIOR GENERAL VIEW FIRST:",JSON.stringify({macroPos,overview}));
            if(overview.option!=="interior"||overview.selectedAnnotation||overview.inCabin||
               overview.optionLabel!=="CABINA")
              throw Error("Interior category must show full truck with doors first, not enter cabin");
            await page.locator("#carouselSelected").click();
            await page.waitForFunction(()=>window.__kiaThreeViewer?.isInCabin?.()&&
              window.__kiaAnnotations?.selected==="interior",null,{timeout:22000});
            console.log("CABINA EXPLICIT ENTRY OK");
            await page.locator("#carouselNext").click();
            await page.waitForFunction(()=>window.__kiaAnnotations?.selected==="seats"&&
              !!window.__kiaThreeViewer?.seatFraming?.target,
              null,{timeout:20000,polling:150});
            const interior=await page.evaluate(()=>({
              option:window.__kiaCarousel.selected,
              doors:window.__kiaThreeViewer.getAllDoorDegrees(),
              seat:window.__kiaThreeViewer.seatFraming,
              sound:window.__kiaThreeViewer.doorAudio?.openCount
            }));
            console.log("SEAT AFTER CABINA:",JSON.stringify(interior));
            if(interior.option!=="seats"||!interior.sound||!interior.seat?.target)
              throw Error("Interior carousel did not open doors and focus seat");
            await page.locator(".kia-category[data-category='colors']").click();
            await page.waitForFunction(()=>
              Object.values(window.__kiaThreeViewer.getAllDoorDegrees()).every(a=>Math.abs(a)<2),
              null,{timeout:25000,polling:150});
            await page.locator("#primaryButton").click();
            if(!(await page.locator("#kiaFeatureCarousel").isHidden())||
               !(await page.locator(".kia-category-rail").isHidden()))throw Error("Mission must hide model controls");
            await page.locator("#secondaryButton").click();
            await page.setViewportSize({width:390,height:844});
            await page.waitForTimeout(350);
            const portraitTitle=await page.evaluate(()=>{
              const h=document.querySelector("#vehicleCopy h1");
              const range=document.createRange();
              range.selectNodeContents(h.firstChild);
              const title=range.getBoundingClientRect();
              const area=document.querySelector(".side-content").getBoundingClientRect();
              return {font:getComputedStyle(h).fontFamily,width:Math.round(title.width),
                      available:Math.round(area.width),overflow:Math.round(title.right-area.right)};
            });
            console.log("TYPOGRAPHY PORTRAIT:",JSON.stringify(portraitTitle));
            if(portraitTitle.overflow>12)throw Error("TASMAN typography clipped in portrait: "+JSON.stringify(portraitTitle));
            if(pageErrors.length)throw Error("Browser JS errors: "+pageErrors.join("; "));
            console.log("PASS: 4 categories, partial adjacent labels, carousel camera/color/detail/seat interactions, info below on right, door open/close, mission UI, responsive layout");
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
