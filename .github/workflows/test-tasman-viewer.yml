name: Verify Kia Tasman Three.js on mobile-sized Chromium
on:
  workflow_dispatch:
  push:
    paths:
      - 'app.js'
      - 'index.html'
      - 'kia-three-renderer.js'
      - 'assets/kia-tasman-quality.glb'
      - '.github/workflows/test-tasman-viewer.yml'
permissions:
  contents: read
jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium automation
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify integrated Three.js 3D viewer and UI
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/tasman-server.log 2>&1 &
          node --input-type=commonjs <<'NODE'
          const {chromium}=require("playwright");
          (async()=>{
            const browser=await chromium.launch({headless:true,args:[
              "--use-gl=angle","--use-angle=swiftshader",
              "--enable-webgl","--enable-unsafe-swiftshader",
              "--no-sandbox","--disable-dev-shm-usage"
            ]});
            const page=await browser.newPage({
              viewport:{width:915,height:412},
              deviceScaleFactor:1,isMobile:true,hasTouch:true
            });
            const pageErrors=[];
            page.on("pageerror",error=>pageErrors.push(error.message));
            page.on("console",m=>{if(m.type()==="error")console.log("CONSOLE:",m.text())});
            page.on("requestfailed",r=>console.log("REQUEST FAILED:",r.url(),r.failure()?.errorText));
            await page.goto("http://127.0.0.1:8765/?integration-test=three",{waitUntil:"domcontentloaded",timeout:45000});
            await page.waitForFunction(
              ()=>window.__kiaViewerStatus?.loaded===true || !!window.__kiaViewerStatus?.error,
              null,{timeout:150000,polling:300}
            );
            const initial=await page.evaluate(()=>{
              const status=window.__kiaViewerStatus||{};
              const debug=window.__kiaThreeViewer||{};
              const canvas=document.querySelector("#carCanvas");
              return {
                loaded:status.loaded,
                error:status.error||debug.error,
                engine:status.engine,meshCount:status.meshCount,
                texturesBound:status.texturesBound,
                corrected:debug.opaqueCorrected,
                canvasVisible:!canvas.hidden&&getComputedStyle(canvas).visibility==="visible",
                camera:status.getCamera?.(),
                cameraButtons:document.querySelectorAll("#cameraButtons button").length,
                featureButtons:document.querySelectorAll(".component-button-grid [data-feature]").length,
                hasOriginalUI:!!document.querySelector(".topbar")&&!!document.querySelector(".right-rail"),
              };
            });
            console.log("THREE INITIAL:",JSON.stringify(initial));
            if(!initial.loaded||initial.engine!=="three"||initial.meshCount<23||
               initial.texturesBound<1||!initial.corrected?.includes("Car")||
               !initial.corrected?.includes("Interior")||!initial.canvasVisible||
               !initial.hasOriginalUI||initial.cameraButtons!==5||initial.featureButtons!==18) {
              throw Error("THREE INTEGRATION FAILED: "+JSON.stringify(initial));
            }
            const menus=await page.evaluate(()=>({
              open:Array.from(document.querySelectorAll(".micro-toggle")).filter(b=>b.getAttribute("aria-expanded")==="true").length,
              panelsHidden:Array.from(document.querySelectorAll(".micro-panel")).every(p=>p.hidden),
              pins:document.querySelectorAll(".kia-annotation-pin").length,
              colors:Array.from(document.querySelectorAll(".color-chip")).map(b=>b.dataset.color)
            }));
            if(!menus.panelsHidden||menus.pins!==0||
              JSON.stringify(menus.colors)!==JSON.stringify(["arena","gris","negro","verde"]))
              throw Error("Unexpected default micro-menus or colors: "+JSON.stringify(menus));
            await page.locator("#toggleCameras").click();
            await page.locator('#cameraButtons [data-pose="front"]').click();
            await page.waitForTimeout(1000);
            const front=await page.evaluate(()=>window.__kiaViewerStatus?.getCamera?.());
            await page.locator('#cameraButtons [data-pose="top"]').click();
            await page.waitForTimeout(1000);
            const top=await page.evaluate(()=>window.__kiaViewerStatus?.getCamera?.());
            if(!(top?.[1]>front?.[1]+1.0))throw Error("Top camera did not move overhead");
            await page.locator("#toggleExterior").click();
            if(!(await page.locator("#panelCameras").isHidden()))throw Error("Cameras menu stayed open");
            await page.locator('.micro-feature[data-feature="front_fascia"]').click();
            await page.waitForFunction(()=>window.__kiaAnnotations?.selected==="front_fascia"&&
              !document.getElementById("featureDetail").hidden,null,{timeout:10000});
            if(await page.locator("#infoModal").isVisible())throw Error("Legacy info modal opened");
            if(await page.locator(".kia-annotation-pin").count())throw Error("Hotspots visible over model");
            console.log("EXTERIOR NOTE:",await page.locator("#featureDetail").innerText());
            await page.locator("#toggleInterior").click();
            if(!(await page.locator("#panelExterior").isHidden()))throw Error("Exterior menu stayed open");
            await page.locator('.micro-feature[data-feature="interior"]').click();
            await page.waitForTimeout(2100);
            const cabin=await page.evaluate(()=>({
              inside:window.__kiaThreeViewer?.isInCabin?.(),
              doorExists:window.__kiaThreeViewer?.doorAvailable,
              angle:window.__kiaThreeViewer?.getDoorDegrees?.(),
              camera:window.__kiaViewerStatus?.getCamera?.(),
              selected:window.__kiaAnnotations?.selected
            }));
            console.log("CABIN ENTRY:",JSON.stringify(cabin));
            if(!cabin.inside||!cabin.doorExists||Math.abs(cabin.angle)<45||cabin.selected!=="interior")
              throw Error("Door opening and cabin entry failed: "+JSON.stringify(cabin));
            await page.locator('#featureDetail button[aria-label="Cerrar anotación"]').click();
            await page.waitForTimeout(1250);
            const exit=await page.evaluate(()=>({inside:window.__kiaThreeViewer?.isInCabin?.(),angle:window.__kiaThreeViewer?.getDoorDegrees?.()}));
            if(exit.inside||Math.abs(exit.angle)>2)throw Error("Door did not close: "+JSON.stringify(exit));
            console.log("MICROMENU PASS:",JSON.stringify({menus,front,top,cabin,exit}));
            await page.screenshot({path:"kia-three-mobile-landscape.png",timeout:30000});
            await page.setViewportSize({width:390,height:844});
            await page.waitForTimeout(300);
            await page.screenshot({path:"kia-three-mobile-portrait.png",timeout:30000});
            if(pageErrors.length)throw Error("Browser JS errors: "+pageErrors.join("; "));
            console.log("PASS: mobile Three.js, 5 camera poses, 18 menu annotations, 4 official swatches, hinged door entry/exit, zero 3D markers");
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kia-three-mobile-screenshots
          path: kia-three-mobile-*.png
          if-no-files-found: ignore
