name: Verify Kia Tasman PlayCanvas model-only HUD
on:
  workflow_dispatch:
  push:
    paths:
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'kia-playcanvas-renderer.js'
      - 'kia-annotations.js'
      - 'kia-carousel.js'
      - '.github/workflows/test-tasman-viewer.yml'
permissions:
  contents: read
jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install mobile Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify transparent 3D model and existing interactive HUD
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/kia-server.log 2>&1 &
          node --input-type=commonjs <<'NODE'
          const {chromium}=require("playwright");
          (async()=>{
            const browser=await chromium.launch({headless:true,args:[
              "--use-gl=angle","--use-angle=swiftshader",
              "--enable-webgl","--enable-unsafe-swiftshader",
              "--no-sandbox","--disable-dev-shm-usage"
            ]});
            const page=await browser.newPage({
              viewport:{width:915,height:412},
              deviceScaleFactor:1,isMobile:true,hasTouch:true
            });
            const exceptions=[];
            page.on("pageerror",e=>exceptions.push(e.message));
            page.on("console",m=>{if(m.type()==="error")console.log("CONSOLE:",m.text())});
            await page.goto("http://127.0.0.1:8765/?qa=model-only",{waitUntil:"domcontentloaded",timeout:45000});
            await page.waitForFunction(()=>window.__kiaViewerStatus?.loaded===true||
              !!window.__kiaViewerStatus?.error,null,{timeout:150000,polling:250});
            await page.waitForFunction(()=>!!window.__kiaCarousel&&!!window.__kiaAnnotations,
              null,{timeout:25000});
            await page.waitForTimeout(650);
            const main=await page.evaluate(()=>{
              const exp=document.getElementById("experience");
              const canvas=document.getElementById("carCanvas");
              const app=window.__kiaPlayCanvasViewer;
              const canvasStyle=getComputedStyle(canvas);
              return {
                loaded:window.__kiaViewerStatus?.loaded,
                engine:window.__kiaViewerStatus?.engine,
                meshes:window.__kiaViewerStatus?.meshCount,
                alpha:canvas.getContext("webgl2")?.getContextAttributes()?.alpha??null,
                visible:!canvas.hidden&&canvasStyle.display!=="none"&&canvasStyle.visibility==="visible",
                stageVisible:getComputedStyle(document.getElementById("stage")).visibility==="visible",
                solidBackground:getComputedStyle(exp).backgroundImage==="none",
                bgColor:getComputedStyle(exp).backgroundColor,
                watermark:getComputedStyle(document.querySelector(".ui-watermark")).display!=="none",
                photoImages:[...document.querySelectorAll(".ambient-backdrop,.ambient-image,.ambient-shade,.ridgeline,.horizon-floor,.ground-glow")]
                  .filter(el=>getComputedStyle(el).display!=="none").length,
                categories:[...document.querySelectorAll(".kia-category")].map(e=>e.dataset.category),
                skybox:window.__kiaPlayCanvasViewer?.sceneCleanup,
                title:document.querySelector(".vehicle-copy h1")?.innerText
              };
            });
            console.log("MODEL ONLY INITIAL:",JSON.stringify(main));
            if(!main.loaded||main.engine!=="playcanvas"||main.meshes<23||
              !main.visible||!main.stageVisible||!main.solidBackground||!main.watermark||
              main.photoImages!==0||!main.title?.includes("TASMAN")||
              JSON.stringify(main.categories)!==JSON.stringify(["cameras","colors","exterior","interior"]))
              throw Error("3D model-only HUD is not intact: "+JSON.stringify(main));
            await page.locator(".kia-category[data-category='colors']").click();
            await page.locator("#carouselNext").click();
            await page.waitForFunction(()=>window.__kiaPlayCanvasViewer?.paintApplied==="gris",
              null,{timeout:12000});
            await page.locator(".kia-category[data-category='interior']").click();
            await page.waitForFunction(()=>Object.keys(window.__kiaPlayCanvasViewer?.getAllDoorDegrees?.()||{}).length===4&&
              Object.values(window.__kiaPlayCanvasViewer.getAllDoorDegrees()).every(v=>Math.abs(v)>50),
              null,{timeout:25000,polling:140});
            console.log("DOORS OPEN:",JSON.stringify(await page.evaluate(()=>
              window.__kiaPlayCanvasViewer.getAllDoorDegrees())));
            await page.locator("#primaryButton").click();
            await page.waitForTimeout(500);
            const mission=await page.evaluate(()=>({
              section:document.getElementById("sectionIndex").textContent,
              canvasVisible:getComputedStyle(document.getElementById("carCanvas")).visibility,
              background:getComputedStyle(document.getElementById("experience")).backgroundImage,
              missionCarousel:!document.getElementById("missionSelector").hidden,
              watermark:getComputedStyle(document.querySelector(".ui-watermark")).display
            }));
            console.log("MISSION MODE WITHOUT SCENE:",JSON.stringify(mission));
            if(!mission.section.includes("PRUEBAS")||mission.canvasVisible!=="visible"||
              mission.background!=="none"||!mission.missionCarousel||mission.watermark==="none")
              throw Error("Model or graphic HUD disappeared in mission mode");
            await page.locator("#secondaryButton").click();
            await page.setViewportSize({width:390,height:844});
            await page.waitForTimeout(400);
            const portrait=await page.evaluate(()=>({
              stage:getComputedStyle(document.getElementById("stage")).visibility,
              canvas:getComputedStyle(document.getElementById("carCanvas")).visibility,
              watermark:getComputedStyle(document.querySelector(".ui-watermark")).display,
              image:getComputedStyle(document.getElementById("experience")).backgroundImage,
              font:getComputedStyle(document.querySelector(".vehicle-copy h1")).fontFamily
            }));
            console.log("PORTRAIT MODEL ONLY:",JSON.stringify(portrait));
            if(portrait.stage!=="visible"||portrait.canvas!=="visible"||
              portrait.watermark==="none"||portrait.image!=="none"||
              !portrait.font.includes("Unbounded"))
              throw Error("Portrait model-only composition failed");
            if(exceptions.length)throw Error("Browser exceptions: "+exceptions.join("; "));
            console.log("PASS: PlayCanvas real 23-mesh truck, transparent canvas, no background photographs/studio, watermark, fonts, HUD, colors, four doors, mission mode and portrait");
            await browser.close();
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE
