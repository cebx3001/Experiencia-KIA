name: Verify Kia Tasman Three.js on mobile-sized Chromium
on:
  workflow_dispatch:
  push:
    paths:
      - 'app.js'
      - 'index.html'
      - 'kia-three-renderer.js'
      - 'assets/kia-tasman-quality.glb'
      - '.github/workflows/test-tasman-viewer.yml'
permissions:
  contents: read
jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium automation
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify integrated Three.js 3D viewer and UI
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/tasman-server.log 2>&1 &
          node --input-type=commonjs <<'NODE'
          const {chromium}=require("playwright");
          (async()=>{
            const browser=await chromium.launch({headless:true,args:[
              "--use-gl=angle","--use-angle=swiftshader",
              "--enable-webgl","--enable-unsafe-swiftshader",
              "--no-sandbox","--disable-dev-shm-usage"
            ]});
            const page=await browser.newPage({
              viewport:{width:915,height:412},
              deviceScaleFactor:1,isMobile:true,hasTouch:true
            });
            const pageErrors=[];
            page.on("pageerror",error=>pageErrors.push(error.message));
            page.on("console",m=>{if(m.type()==="error")console.log("CONSOLE:",m.text())});
            page.on("requestfailed",r=>console.log("REQUEST FAILED:",r.url(),r.failure()?.errorText));
            await page.goto("http://127.0.0.1:8765/?integration-test=three",{waitUntil:"domcontentloaded",timeout:45000});
            await page.waitForFunction(
              ()=>window.__kiaViewerStatus?.loaded===true || !!window.__kiaViewerStatus?.error,
              null,{timeout:150000,polling:300}
            );
            const initial=await page.evaluate(()=>{
              const status=window.__kiaViewerStatus||{};
              const debug=window.__kiaThreeViewer||{};
              const canvas=document.querySelector("#carCanvas");
              return {
                loaded:status.loaded,
                error:status.error||debug.error,
                engine:status.engine,meshCount:status.meshCount,
                texturesBound:status.texturesBound,
                corrected:debug.opaqueCorrected,
                canvasVisible:!canvas.hidden&&getComputedStyle(canvas).visibility==="visible",
                camera:status.getCamera?.(),
                cameraButtons:document.querySelectorAll("#cameraButtons button").length,
                featureButtons:document.querySelectorAll("[data-feature]").length,
                hasOriginalUI:!!document.querySelector(".topbar")&&!!document.querySelector(".right-rail"),
              };
            });
            console.log("THREE INITIAL:",JSON.stringify(initial));
            if(!initial.loaded||initial.engine!=="three"||initial.meshCount<23||
               initial.texturesBound<1||!initial.corrected?.includes("Car")||
               !initial.corrected?.includes("Interior")||!initial.canvasVisible||
               !initial.hasOriginalUI||initial.cameraButtons!==3||initial.featureButtons!==4) {
              throw Error("THREE INTEGRATION FAILED: "+JSON.stringify(initial));
            }
            await page.locator('#cameraButtons [data-angle="90"]').click();
            const after=await page.evaluate(()=>window.__kiaViewerStatus?.getCamera?.());
            if(!after||JSON.stringify(after)===JSON.stringify(initial.camera))throw Error("Camera buttons not wired");
            console.log("THREE CAMERA:",JSON.stringify({before:initial.camera,after}));
            const box=await page.locator("#carCanvas").boundingBox();
            if(!box)throw Error("Missing 3D canvas");
            const mx=box.x+box.width*.5, my=box.y+box.height*.52;
            await page.mouse.move(mx,my);
            await page.mouse.down();
            await page.mouse.move(mx+60,my,{steps:5});
            await page.mouse.up();
            const afterDrag=await page.evaluate(()=>window.__kiaViewerStatus?.getCamera?.());
            if(JSON.stringify(after)===JSON.stringify(afterDrag))throw Error("Pointer rotation not wired");
            console.log("THREE DRAG:",JSON.stringify({before:after,after:afterDrag}));
            await page.screenshot({path:"kia-three-mobile-landscape.png",timeout:30000});
            await page.setViewportSize({width:390,height:844});
            await page.waitForTimeout(300);
            await page.screenshot({path:"kia-three-mobile-portrait.png",timeout:30000});
            if(pageErrors.length)throw Error("Browser JS errors: "+pageErrors.join("; "));
            console.log("PASS: Three.js viewer, opacity fix, interface, cameras, pointer rotation and mobile viewports");
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kia-three-mobile-screenshots
          path: kia-three-mobile-*.png
          if-no-files-found: ignore
