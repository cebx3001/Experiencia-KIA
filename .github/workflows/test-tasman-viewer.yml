name: Verify Kia Tasman standalone graphic interface
on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'tasman-nueva.html'
      - 'tasman-nueva.css'
      - 'tasman-nueva.js'
      - 'tasman-nueva-carousel.js'
      - '.github/workflows/test-tasman-viewer.yml'
permissions:
  contents: read
jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium test browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify no scenes or 3D and working Kia selectors
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/kia-server.log 2>&1 &
          node --input-type=commonjs <<'NODE'
          const {chromium}=require("playwright");
          (async()=>{
            const browser=await chromium.launch({headless:true,args:["--no-sandbox","--disable-dev-shm-usage"]});
            const page=await browser.newPage({viewport:{width:1280,height:720}});
            const errors=[];
            page.on("pageerror",e=>errors.push(e.message));
            await page.goto("http://127.0.0.1:8765/",{waitUntil:"networkidle",timeout:45000});
            await page.waitForFunction(()=>!!window.__kiaCarousel&&!!window.__kiaUI,null,{timeout:15000});
            const probe=()=>page.evaluate(()=>{
              const root=document.getElementById("experience");
              const cs=getComputedStyle(root);
              const absent=[...document.querySelectorAll(".ambient-backdrop,.ambient-image,.ambient-shade,.ridgeline,.horizon-floor,.ground-glow")].every(el=>getComputedStyle(el).display==="none");
              return {
                mode:window.__kiaUI.mode,category:window.__kiaUI.category,
                bg:cs.backgroundColor,image:cs.backgroundImage,photosHidden:absent,
                noCanvas:!document.querySelector("canvas,#carCanvas,#stage"),
                title:document.querySelector(".vehicle-copy h1")?.textContent,
                watermark:getComputedStyle(document.querySelector(".ui-watermark")).display
              };
            });
            const initial=await probe();
            if(initial.image!=="none"||initial.bg!=="rgb(16, 19, 22)"||
              !initial.photosHidden||!initial.noCanvas||initial.watermark==="none"||
              !initial.title?.includes("TASMAN"))throw Error("Initial HUD: "+JSON.stringify(initial));
            await page.locator(".kia-category[data-category='colors']").click();
            await page.locator("#carouselNext").click();
            if((await page.locator("#carouselSelected").textContent()).trim()!=="INTERSTELLAR GRAY")
              throw Error("Colors carousel unavailable");
            await page.locator(".kia-category[data-category='interior']").click();
            await page.locator("#primaryButton").click();
            await page.locator("#nextMission").click();
            let mission=await probe();
            if(mission.mode!=="mission"||mission.image!=="none"||!mission.photosHidden||
              !mission.noCanvas||!(await page.locator("#missionSelector").isVisible()))
              throw Error("Mission HUD: "+JSON.stringify(mission));
            if((await page.locator("#selectorName").textContent()).trim()!=="WATER CROSSING")
              throw Error("Mission navigation broken");
            await page.locator("#secondaryButton").click();
            await page.setViewportSize({width:390,height:844});
            await page.waitForTimeout(200);
            const portrait=await probe();
            if(portrait.image!=="none"||portrait.bg!=="rgb(16, 19, 22)"||
              !portrait.photosHidden||!portrait.noCanvas||portrait.watermark==="none")
              throw Error("Portrait HUD: "+JSON.stringify(portrait));
            await page.locator("#secondaryButton").click();
            const fonts=await page.evaluate(()=>{
              const read=selector=>{const style=getComputedStyle(document.querySelector(selector));return {family:style.fontFamily,weight:style.fontWeight,spacing:style.letterSpacing,stroke:style.webkitTextStrokeWidth};};
              return {
                title:read(".vehicle-copy h1"),
                year:read(".vehicle-copy .year"),
                nav:read(".kia-category"),
                copy:read(".vehicle-copy .subcopy"),
                counter:read(".frame-index")
              };
            });
            console.log("TYPOGRAPHY:",JSON.stringify(fonts));
            if(!fonts.title.family.includes("Monument Extended")||
               !fonts.year.family.includes("Space Grotesk")||
               fonts.year.stroke!=="1.5px"||
               !fonts.nav.family.includes("JetBrains Mono")||
               !fonts.copy.family.includes("Space Grotesk")||
               !fonts.counter.family.includes("Space Grotesk"))
              throw Error("Kia typography guide not applied: "+JSON.stringify(fonts));
            if(errors.length)throw Error("Browser errors: "+errors.join("; "));
            console.log("PASS: Only the Kia editorial graphic UI is visible, both orientations, with working selectors and no photo or 3D viewer.");
            await browser.close();
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE
