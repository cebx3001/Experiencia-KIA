name: Generate only the approved X-TREK scene
on:
  workflow_dispatch:
  push:
    branches: [feat/tasman-experiencia-cines]
    paths: ['.github/workflows/generate-tasman-xtrek.yml', 'tools/tasman-xtrek/**', 'docs/tasman/video/xtrek/production.json']
permissions:
  contents: write
concurrency:
  group: tasman-seedance-xtrek
  cancel-in-progress: false
jobs:
  xtrek:
    if: github.ref == 'refs/heads/feat/tasman-experiencia-cines'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tasman-experiencia-cines
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the X-TREK production guards without credentials
        run: python -m unittest discover -s tools/tasman-xtrek -p 'test_*.py' -v
      - name: Ensure FFmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Generate only X-TREK with the approved master at both endpoints
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_ACCESS }}
        run: python tools/tasman-xtrek/produce.py
      - name: Preserve the X-TREK deliverables and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tasman-xtrek-${{ github.run_number }}
          path: docs/tasman/video/xtrek/
          retention-days: 90
      - name: Save the output to the requested branch
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/tasman/video/xtrek/
          if ! git diff --cached --quiet; then
            git commit -m 'Save X-TREK generation and review status [skip ci]'
            git pull --rebase origin feat/tasman-experiencia-cines
            git push origin HEAD:refs/heads/feat/tasman-experiencia-cines
          fi
