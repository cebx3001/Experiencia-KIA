name: Produce the single client-requested XTREK correction
on:
  workflow_dispatch:
  push:
    branches: [feat/tasman-experiencia-cines]
    paths: ['.github/workflows/generate-tasman-xtrek.yml']
permissions:
  contents: write
concurrency:
  group: tasman-seedance-xtrek
  cancel-in-progress: false
jobs:
  xtrek:
    if: github.ref == 'refs/heads/feat/tasman-experiencia-cines'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tasman-experiencia-cines
      - name: Ensure FFmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Verify the approved XTREK master and explicit frame anchors
        run: |
          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path
          config = json.loads(Path('docs/tasman/video/xtrek/production.json').read_text())
          master = Path('docs/tasman/video/intro/master.png')
          assert hashlib.sha256(master.read_bytes()).hexdigest() == config['master_sha256']
          assert config['identity_mode'] == 'approved_master_only'
          assert config['maximum_new_charge_reserved_usd'] == 3.0
          assert config['aspect_ratio'] == '9:16'
          PY
      - name: Check budget and generate or resume XTREK
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_ACCESS }}
        run: python3 tools/tasman-vadeo/produce.py xtrek
      - name: Persist the receipt and delivery
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/tasman/video/xtrek
          if ! git diff --cached --quiet; then
            git commit -m 'Save XTREK generation and review status [skip ci]'
            git pull --rebase origin feat/tasman-experiencia-cines
            git push origin HEAD:refs/heads/feat/tasman-experiencia-cines
          fi
      - name: Preserve the playable proposal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tasman-xtrek
          path: docs/tasman/video/xtrek/
          retention-days: 30
