name: Verify mobile Tasman video experience and actual Pages delivery
on:
  workflow_dispatch:
  push:
    branches: [feat/tasman-unreal-studio]
    paths: ['experiencia/**', 'diagnostics/verify-mobile-video.cjs', 'diagnostics/verify-mobile-published.py', '.github/workflows/verify-campaign.yml']
permissions:
  contents: read
jobs:
  campaign:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve and verify the complete mobile video flow without loading a 3D model
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/tasman-http.log 2>&1 &
          node diagnostics/verify-mobile-video.cjs
      - name: Verify actual Pages video, image and QR hashes
        run: python3 diagnostics/verify-mobile-published.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tasman-mobile-campaign-verification
          path: docs/tasman/evidence/mobile-*.json
