name: Verify OpenRouter connection without generating video

on:
  workflow_dispatch:
  push:
    branches: [feat/tasman-experiencia-cines]
    paths: ['.github/workflows/verify-openrouter-connection.yml']

permissions:
  contents: write

jobs:
  connection:
    if: github.ref == 'refs/heads/feat/tasman-experiencia-cines'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tasman-experiencia-cines
      - name: Verify the configured key with an authenticated read-only request
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_ACCESS }}
        run: |
          python - <<'PY'
          import importlib.util, json, os, urllib.error, urllib.request
          from pathlib import Path
          report = {'secret_name': 'OPEN_ROUTER_ACCESS', 'endpoint': '/api/v1/key', 'generation_submitted': False}
          token = os.environ.get('OPENROUTER_API_KEY', '')
          if not token:
              report.update(authenticated=False, reason='Actions received an empty secret')
          else:
              req = urllib.request.Request('https://openrouter.ai/api/v1/key', headers={'Authorization': 'Bearer ' + token})
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      body = json.load(response)
                      report.update(http_status=response.status, authenticated=response.status == 200 and isinstance(body.get('data'), dict))
              except urllib.error.HTTPError as error:
                  report.update(http_status=error.code, authenticated=False)
          Path('docs/tasman/video/intro/connection.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report))
          if not report.get('authenticated'):
              raise SystemExit('OpenRouter authentication could not be verified')
          receipt = Path('docs/tasman/video/intro/job.json')
          if receipt.exists():
              spec = importlib.util.spec_from_file_location('intro', 'tools/tasman-video/produce_intro.py')
              intro = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(intro)
              job_id = json.loads(receipt.read_text())['job']['id']
              job = json.loads(intro.request(intro.API + '/videos/' + job_id, authenticated=True))
              result = intro.safe_job(job)
              if job.get('error'):
                  result['error'] = intro.safe_api_error(json.dumps({'error': job['error']}))
              intro.write('provider-status.json', result)
              print(json.dumps(result))
          PY
      - name: Verify the actual public intro and X-TREK files
        run: |
          python - <<'PY'
          import hashlib, json, time, urllib.request
          from pathlib import Path
          def verify(folder, base):
              expected = json.loads((folder / 'public-manifest.json').read_text())
              def fetch(name):
                  req = urllib.request.Request(base + name + '?verify=' + expected['release'], headers={'Cache-Control': 'no-cache'})
                  with urllib.request.urlopen(req, timeout=45) as response:
                      return response.read()
              for attempt in range(20):
                  try:
                      live = json.loads(fetch('public-manifest.json'))
                      assert live['release'] == expected['release'], 'Old preview build'
                      for name, digest in expected['files'].items():
                          assert hashlib.sha256(fetch(name)).hexdigest() == digest, name
                      report = {'passed': True, 'release': expected['release'], 'url': base, 'files_verified': len(expected['files'])}
                      (folder / 'pages-verification.json').write_text(json.dumps(report, indent=2) + '\n')
                      print(json.dumps(report))
                      break
                  except Exception as error:
                      print('Awaiting published preview:', str(error), flush=True)
                      if attempt == 19:
                          raise
                      time.sleep(15)
          verify(Path('docs/tasman/video/intro'), 'https://cebx3001.github.io/Experiencia-KIA/preview/tasman-intro/')
          verify(Path('docs/tasman/video/xtrek/delivery'), 'https://cebx3001.github.io/Experiencia-KIA/preview/tasman-xtrek/')
          PY
      - name: Save only connection and delivery results, never key data
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/tasman/video/intro/connection.json
          if test -f docs/tasman/video/intro/provider-status.json; then
            git add docs/tasman/video/intro/provider-status.json
          fi
          if test -f docs/tasman/video/intro/pages-verification.json; then
            git add docs/tasman/video/intro/pages-verification.json
          fi
          if test -f docs/tasman/video/xtrek/delivery/pages-verification.json; then
            git add docs/tasman/video/xtrek/delivery/pages-verification.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Record authenticated OpenRouter connectivity check [skip ci]'
            git pull --rebase origin feat/tasman-experiencia-cines
            git push origin HEAD:refs/heads/feat/tasman-experiencia-cines
          fi
