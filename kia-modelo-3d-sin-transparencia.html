<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#10151a">
<title>Kia Tasman 3D — Opaque Test</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10151a}
*{box-sizing:border-box}
#viewer{position:fixed;inset:0;touch-action:none;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="viewer"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

// An independent GLTF renderer. No PlayCanvas, HDRI, color overrides,
// material clones, custom culling, reflection atlases or interface.
const viewer=document.querySelector('#viewer');
const renderer=new THREE.WebGLRenderer({
  antialias:false,
  alpha:false,
  powerPreference:'high-performance',
  preserveDrawingBuffer:false
});
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1;
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
viewer.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x10151a);
const camera=new THREE.PerspectiveCamera(42,1,0.08,300);
scene.add(new THREE.HemisphereLight(0xffffff,0x424952,2.0));
const key=new THREE.DirectionalLight(0xffffff,2.1);
key.position.set(3,7,5);
scene.add(key);
const fill=new THREE.DirectionalLight(0xdceaff,0.75);
fill.position.set(-4,3,-4);
scene.add(fill);

let car=null, radius=7, azimuth=35*Math.PI/180, inclination=.18;
const target=new THREE.Vector3(0,1,0);
const pointers=new Map();
let previousPinch=0;
let frameRequested=false;
let assetStatus='loading';
const diagnostics=window.__kiaIsolatedViewer={
  engine:'three',variant:'quality',status:'loading',geometry:null,materials:null,
  pixels:null,error:null,asset:'kia-tasman-quality.glb'
};

function requestRender(){
 if(frameRequested)return;
 frameRequested=true;
 requestAnimationFrame(()=>{
   frameRequested=false;
   const w=Math.max(1,viewer.clientWidth),h=Math.max(1,viewer.clientHeight);
   if(renderer.domElement.width!==Math.round(w*renderer.getPixelRatio())||
      renderer.domElement.height!==Math.round(h*renderer.getPixelRatio())){
      renderer.setSize(w,h,false);
      camera.aspect=w/h;
      camera.updateProjectionMatrix();
   }
   const cos=Math.cos(inclination);
   camera.position.set(
      target.x+radius*Math.sin(azimuth)*cos,
      target.y+radius*Math.sin(inclination),
      target.z+radius*Math.cos(azimuth)*cos
   );
   camera.lookAt(target);
   renderer.render(scene,camera);
   diagnostics.pixels=[renderer.domElement.width,renderer.domElement.height];
 });
}
new ResizeObserver(requestRender).observe(viewer);
window.addEventListener('resize',requestRender);
window.addEventListener('orientationchange',requestRender);
const canvas=renderer.domElement;
canvas.addEventListener('pointerdown',e=>{
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove',e=>{
  const old=pointers.get(e.pointerId);
  if(!old)return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1){
    azimuth+=(e.clientX-old.x)*.009;
    inclination=THREE.MathUtils.clamp(inclination+(e.clientY-old.y)*.004,-.26,.48);
    requestRender();
  }else if(pointers.size===2){
    const p=[...pointers.values()];
    const dist=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
    if(previousPinch>0){
      radius=THREE.MathUtils.clamp(radius*previousPinch/Math.max(1,dist),3.5,25);
      requestRender();
    }
    previousPinch=dist;
  }
});
for(const type of ['pointerup','pointercancel','lostpointercapture']){
 canvas.addEventListener(type,e=>{
    pointers.delete(e.pointerId);
    if(pointers.size<2)previousPinch=0;
 });
}
canvas.addEventListener('wheel',e=>{
 e.preventDefault();
 radius=THREE.MathUtils.clamp(radius*(e.deltaY>0?1.09:.91),3.5,25);
 requestRender();
},{passive:false});

const decoder=new DRACOLoader();
decoder.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');
const loader=new GLTFLoader();
loader.setDRACOLoader(decoder);
loader.load(
  './assets/kia-tasman-quality.glb',
  gltf=>{
    car=gltf.scene;
    // DIAGNOSTIC: the GLB incorrectly marks the entire Car and Interior meshes
    // (including solid door panels) as transparent BLEND. Force these two
    // original PBR materials to the opaque depth-writing pipeline. Leave all
    // geometry, diffuse/normal/metallic maps and lighting untouched.
    const corrected=new Set();
    const materialState=[];
    car.traverse(object=>{
      if(!object.isMesh)return;
      for(const mat of Array.isArray(object.material)?object.material:[object.material]){
        if(!mat||corrected.has(mat))continue;
        if(mat.name!=='Car'&&mat.name!=='Interior')continue;
        corrected.add(mat);
        materialState.push({name:mat.name,wasTransparent:mat.transparent,wasDepthWrite:mat.depthWrite});
        mat.transparent=false;
        mat.opacity=1;
        mat.alphaTest=0;
        mat.depthWrite=true;
        mat.depthTest=true;
        mat.needsUpdate=true;
      }
    });
    diagnostics.transparencyOverride=materialState;
    scene.add(car);
    // Calculate fit from the real model, no changes to its geometry or material maps.
    const bounds=new THREE.Box3().setFromObject(car);
    const center=bounds.getCenter(new THREE.Vector3());
    const size=bounds.getSize(new THREE.Vector3());
    target.copy(center);
    // Fit into landscape or portrait view; touch gestures can zoom in.
    const verticalFov=camera.fov*Math.PI/180;
    const aspect=Math.max(.2,viewer.clientWidth/Math.max(1,viewer.clientHeight));
    const horizontalFov=2*Math.atan(Math.tan(verticalFov/2)*aspect);
    const effectiveWidth=Math.hypot(size.x,size.z);
    radius=Math.max(
       size.y/(2*Math.tan(verticalFov/2)),
       effectiveWidth/(2*Math.tan(horizontalFov/2))
    )*1.15;
    radius=THREE.MathUtils.clamp(radius,4.0,23);
    let meshes=0,triangles=0,materialNames=new Set();
    car.traverse(o=>{
      if(!o.isMesh)return;
      meshes++;
      const g=o.geometry;
      const pos=g.getAttribute('position');
      triangles+=Math.round((g.index?.count||pos?.count||0)/3);
      for(const m of Array.isArray(o.material)?o.material:[o.material]){
        if(m)materialNames.add(m.name||'(unnamed)');
      }
    });
    diagnostics.status='loaded';
    diagnostics.geometry={meshes,triangles,dimensions:size.toArray()};
    diagnostics.materials=[...materialNames];
    requestRender();
  },
  undefined,
  error=>{
    diagnostics.status='error';
    diagnostics.error=String(error);
    console.error('GLB load failed',error);
  }
);
requestRender();
</script>
</body>
</html>
